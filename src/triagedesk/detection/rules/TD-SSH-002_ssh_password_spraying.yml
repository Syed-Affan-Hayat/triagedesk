id: TD-SSH-002
title: SSH password spraying across many accounts
description: >
  One source address tried several different user names. Spraying keeps the number of
  attempts per account low to avoid lockouts, so it can stay under brute-force thresholds.
source: ssh
severity: high
techniques: [T1110.003]
type: distinct
filter:
  - field: action
    equals: ssh_failed
group_by: src_ip
distinct_field: user
threshold: 4
window_seconds: 900
false_positives:
  - A jump host or shared bastion used by several administrators who mistype passwords.
response:
  - Block the source address and review the full list of user names it tried.
  - Confirm that none of the targeted accounts logged in successfully afterwards.
  - Remove or disable unused default accounts such as admin, test and guest.
