# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: triagedesk
    runtime: docker
    plan: free
    healthCheckPath: /_stcore/health
    envVars:
      - key: TRIAGEDESK_ENRICHMENT_MODE
        value: mock
      # Optional language model settings. Values are entered in the Render dashboard.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
